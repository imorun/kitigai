<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>キチガイ風車 認識ボタン</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#000}
body{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;color:#fff;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#world{position:fixed;inset:0;background:linear-gradient(#5aa9e6 0%,#a7d8f5 48%,#d9f0d0 58%)}
#sun{position:absolute;top:9%;right:12%;width:12vmin;height:12vmin;border-radius:50%;background:radial-gradient(#fffbe0 40%,#ffe98a 70%,transparent 72%);box-shadow:0 0 60px 20px #fff4b0aa}
#hills{position:absolute;left:0;right:0;top:44%;height:20%;background:radial-gradient(120% 100% at 25% 100%,#6fb35a 60%,transparent 61%),radial-gradient(110% 100% at 80% 100%,#5ba24b 60%,transparent 61%)}
#ground{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(#5fae48,#3e8a33 60%,#2c6e27)}
#grass{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
#grass g{animation:sway 4s ease-in-out infinite alternate}
#grass g:nth-child(2){animation-duration:5s;animation-delay:-1s}
#grass g:nth-child(3){animation-duration:3.6s;animation-delay:-2s}
#grass g:nth-child(4){animation-duration:4.4s;animation-delay:-3s}
@keyframes sway{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
#mill{position:absolute;left:50%;bottom:50%;width:0;height:0;font-size:clamp(2.2rem,9vmin,4rem);line-height:1;transform-origin:0 0;transform:scale(.7)}
#mill.flash{filter:brightness(2.4)}
#mill.gold{filter:sepia(1) saturate(5) hue-rotate(-12deg) brightness(1.15) drop-shadow(0 0 .35em #ffd34d)}
#mill.gold.flash{filter:sepia(1) saturate(3) brightness(2.6) drop-shadow(0 0 .5em #fff3b0)}
#red{position:fixed;inset:0;z-index:7;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,0,0,.5) 0%,rgba(140,0,0,1) 100%);opacity:0;transition:opacity .15s}
#head{position:absolute;left:0;top:0;width:0;height:0}
#ring{position:absolute;left:0;top:0;width:0;height:0;animation:spin 3.2s linear infinite}
.e{position:absolute;width:1.2em;height:1.2em;margin:-.6em 0 0 -.6em;display:flex;align-items:center;justify-content:center}
body.seen #ring{animation:none}
#world.hit{animation:shake .14s linear}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{25%{transform:translate(2px,-1px)}75%{transform:translate(-2px,1px)}}
#ui{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(1.2rem + env(safe-area-inset-top,0px)) 1rem calc(1.6rem + env(safe-area-inset-bottom,0px));pointer-events:none}
#ui>*{pointer-events:auto}
h1{margin:0;font-size:clamp(1rem,3.6vw,1.4rem);text-shadow:0 2px 8px #0008;text-align:center}
#msg{text-align:center;max-width:22em;line-height:1.6;text-shadow:0 2px 8px #000a;min-height:3.2em}
body.seen #msg{color:#ffb0b0;font-weight:700}
.bot{display:flex;flex-direction:column;align-items:center;gap:.6rem}
button{font:inherit;font-weight:700;padding:.85em 2.2em;border-radius:999px;border:2px solid #fff;background:#1c1b1a;color:#fff;cursor:pointer;box-shadow:0 4px 18px #0006}
button:focus-visible{outline:3px solid #ff3b3b;outline-offset:3px}
body.over h1,body.over #msg,body.over #count{opacity:0}
h1,#msg,#count{transition:opacity 1s}
#hp{display:flex;gap:3px;width:min(90vw,24rem)}
#hp i{flex:1;min-width:0;height:.7rem;border-radius:3px;background:#ff4d4d;border:1px solid #fff;transition:background .15s}
#hp i.x{background:#3a1a1a}
.fx{position:fixed;font-size:2.4rem;pointer-events:none;z-index:8;transform:translate(-50%,-50%);animation:fx .5s forwards}
@keyframes fx{to{transform:translate(-50%,-130%) scale(1.5);opacity:0}}
#count{font-size:.85rem;text-shadow:0 1px 6px #000a}
#died{position:fixed;inset:0;z-index:9;background:radial-gradient(ellipse at center,#1a0000 0%,#000 75%);opacity:0;pointer-events:none;transition:opacity 1.3s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem}
#died.on{opacity:1}
#died h2{margin:0;font-family:"Times New Roman","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:400;font-size:clamp(2.6rem,13vw,7rem);letter-spacing:.16em;color:#9e1414;opacity:0;transition:opacity 2s}
#died.txt h2{opacity:1;animation:str 5s linear forwards}
#died p{margin:0;color:#7a4a4a;font-size:.9rem;opacity:0;transition:opacity 2s 1s}
#died.txt p{opacity:1}
@keyframes str{to{transform:scaleX(1.12)}}
@media (prefers-reduced-motion:reduce){#ring,#world.hit{animation:none!important}#mill{transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="world">
  <div id="sun"></div><div id="hills"></div><div id="ground"><svg id="grass" aria-hidden="true"></svg></div>
  <div id="mill" aria-hidden="true">
    
    <div id="head"><div id="ring"></div></div>
  </div>
</div>
<div id="red"></div>
<div id="ui">
  <h1>見て‼️キチガイ風車だよ‼️</h1>
  <div class="bot">
    <div id="hp" hidden></div>
    <p id="msg" role="status" aria-live="polite">草原で風車がゆっくり回っている。まだこちらには気づいていない。</p>
    <button id="go" type="button">認識</button>
    <div id="count">認識された回数: 0</div>
  </div>
</div>
<div id="died" aria-live="assertive"><h2>YOU DIED</h2><p>認識された</p></div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var body=document.body,world=$('world'),mill=$('mill'),ring=$('ring'),msg=$('msg'),go=$('go'),count=$('count'),died=$('died'),hp=$('hp');
  var n=0,wins=0,hits=0,p=0,last=0,raf=0,state='idle',timers=[],els=[];
  var red=$('red'),LIM=.65,DUR=9,GOLD=false,NEED=10,BACK_TOTAL=.15,IDLE='草原で風車がゆっくり回っている。まだこちらには気づいていない。';
  var NORMAL_DUR=5;
  var items=[['😁',0,0,2],['👆',0,-2.1],['👈',-2.1,0],['👉',2.1,0],['👇',0,2.1]],orig=items.map(function(i){return i[0]});
  items.forEach(function(it){
    var e=document.createElement('span');e.className='e';e.textContent=it[0];
    e.style.left=it[1]+'em';e.style.top=it[2]+'em';if(it[3])e.style.zIndex=it[3];
    ring.appendChild(e);els.push(e);
  });
  for(var k=0;k<NEED;k++)hp.appendChild(document.createElement('i'));
  function later(f,t){timers.push(setTimeout(f,t))}
  function setAll(face,hand){els[0].textContent=face;for(var i=1;i<els.length;i++)els[i].textContent=hand}
  function draw(){mill.style.transform='scale('+(.7+Math.pow(p,2.2)*15.3).toFixed(3)+')';red.style.opacity=(Math.pow(Math.min(1,p/LIM),1.3)*.85).toFixed(3)}
  function stats(){count.textContent='認識された回数: '+n+'　撃破: '+wins}
  function pips(){for(var i=0;i<NEED;i++)hp.children[i].className=i<hits?'x':''}
  function reset(){
    timers.forEach(clearTimeout);timers=[];cancelAnimationFrame(raf);
    state='idle';hits=0;p=0;GOLD=false;mill.classList.remove('gold');body.classList.remove('seen','over');
    mill.style.transition='none';mill.style.opacity='1';draw();void mill.offsetWidth;mill.style.transition='';
    els.forEach(function(e,i){e.textContent=orig[i]});
    died.classList.remove('on','txt');pips();hp.hidden=true;
    msg.textContent=IDLE;go.hidden=false;
  }
  function frame(t){
    if(state!=='fight')return;
    p+=(t-last)/1000/DUR;last=t;draw();
    if(p>=LIM){lose();return}
    raf=requestAnimationFrame(frame);
  }
  function seen(){
    if(state!=='idle')return;
    state='fight';n++;stats();hits=0;p=0;pips();GOLD=Math.random()<.25;DUR=(GOLD?4:NORMAL_DUR)/LIM;mill.classList.toggle('gold',GOLD);NEED=10+Math.floor(Math.random()*11);hp.innerHTML='';for(var q=0;q<NEED;q++)hp.appendChild(document.createElement('i'));
    body.classList.add('seen');setAll('🫪','🫵');
    msg.textContent=GOLD?'金色だ！！速い！！急いでパンチ！':'まずい“認識”された！クリックでパンチ！'+NEED+'回で倒せる';
    go.hidden=true;hp.hidden=false;
    if(navigator.vibrate){try{navigator.vibrate([80,40,80])}catch(e){}}
    last=performance.now();raf=requestAnimationFrame(frame);
  }
  function lose(){
    state='over';hp.hidden=true;msg.textContent='追いつかれた……';
    died.classList.add('on');body.classList.add('over');
    later(function(){died.classList.add('txt')},1600);
    later(reset,6000);
  }
  function win(){
    state='over';cancelAnimationFrame(raf);wins++;stats();hp.hidden=true;
    setAll('💥','💥');red.style.opacity='0';msg.textContent=GOLD?'金色の風車を撃破！すごい！':'撃破！風車は倒れた。';
    mill.style.transition='opacity 1.2s .6s';mill.style.opacity='0';
    later(reset,3600);
  }
  function punch(x,y){
    hits++;if(!GOLD)p=Math.max(0,p-BACK_TOTAL/NEED);draw();pips();
    var f=document.createElement('span');f.className='fx';f.textContent='👊';f.style.left=x+'px';f.style.top=y+'px';
    document.body.appendChild(f);setTimeout(function(){f.remove()},520);
    world.classList.remove('hit');void world.offsetWidth;world.classList.add('hit');
    mill.classList.add('flash');setTimeout(function(){mill.classList.remove('flash')},90);
    if(navigator.vibrate){try{navigator.vibrate(25)}catch(e){}}
    if(hits>=NEED)win();
  }
  document.addEventListener('pointerdown',function(e){if(state==='fight')punch(e.clientX,e.clientY)});
  function blades(){
    var svg=$('grass'),W=svg.clientWidth||innerWidth,H=svg.clientHeight||innerHeight*.46,NS='http://www.w3.org/2000/svg';
    svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('preserveAspectRatio','none');svg.innerHTML='';
    var rows=[[0,'#4f9e3c',9,16],[.28,'#5fb046',12,24],[.55,'#4a9a38',15,34],[.82,'#6cc24f',19,46]],seed=7;
    function r(){seed=(seed*16807)%2147483647;return seed/2147483647}
    rows.forEach(function(row){
      var g=document.createElementNS(NS,'g'),d='',y=H*row[0]+4;
      for(var x=-20;x<W+20;x+=row[2]*.8){
        var h=row[3]*(.6+r()*.8),w=row[2]*(.7+r()*.5),lean=(r()-.5)*row[2]*.8;
        d+='M'+x.toFixed(1)+' '+y.toFixed(1)+'L'+(x+lean+w/2).toFixed(1)+' '+(y-h).toFixed(1)+'L'+(x+w).toFixed(1)+' '+y.toFixed(1)+'Z';
      }
      var pa=document.createElementNS(NS,'path');pa.setAttribute('d',d);pa.setAttribute('fill',row[1]);g.appendChild(pa);svg.appendChild(g);
    });
  }
  blades();var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(blades,150)});
  go.addEventListener('click',seen);
  draw();
})();
</script>
</body>
</html>
